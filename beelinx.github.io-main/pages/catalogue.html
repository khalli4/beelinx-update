<!-- =========================================
     CATALOGUE
========================================== -->

<h1>
    Catalogue
</h1>


<!-- Brands will be generated automatically -->

<div id="brand-section-container"
     class="brand-section-container">

</div>


<!-- =========================================
     COPYRIGHT
========================================== -->

<div class="copyrights-gen">

        © 2026 Beelinx — Fashion Worth Discovering
    </p>

</div>


<!-- =========================================
     JAVASCRIPT
========================================== -->

<script src="../js/main.js"></script>

<script src="../js/api.js"></script>


<script>

    /* =========================================
       GENERATE BRAND CATALOGUE (from the API)
    ========================================= */

    async function initCatalogue() {

        const brandContainer =
            document.getElementById("brand-section-container");

        if (!brandContainer) return;

        showMessage(brandContainer, "Loading...");

        let brands;

        try {
            brands = await api("/brands");
        } catch (err) {
            console.error("Beelinx: could not load brands.", err);
            showMessage(brandContainer, "Could not load brands. Please refresh the page.");
            return;
        }

        brandContainer.replaceChildren();

        brands.forEach((brand) => {

            const brandSection = document.createElement("div");
            brandSection.className = "brand-section";

            const brandLink = document.createElement("a");
            brandLink.href =
                `brandpage-template.html?brand=${encodeURIComponent(brand.name)}`;

            const logo = document.createElement("img");
            logo.className = "brand-logo";
            logo.src = brand.logo || "";
            logo.alt = `${brand.name} Brand Logo`;
            logo.loading = "lazy";

            brandLink.appendChild(logo);

            const name = document.createElement("strong");
            name.textContent = brand.name;

            const logoAlign = document.createElement("p");
            logoAlign.className = "logo-align";
            logoAlign.append(brandLink, document.createElement("br"), name);

            brandSection.appendChild(logoAlign);
            brandContainer.appendChild(brandSection);

        });

    }

    initCatalogue();

</script>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../js/sidebar-auth.js"></script>
